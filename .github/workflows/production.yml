name: Deploy to "spiritual.stokhastik.xyz"
on:
  workflow_dispatch:
concurrency: ftp_deploy_production
jobs:
  web-deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Get latest code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "yarn"

      - name: Build Next.js
        run: |
          yarn install --frozen-lockfile
          yarn build

      - name: List output files
        run: find out/ -print

      - name: Deploy on "spiritual.stokhastik.xyz"
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /
          local-dir: out/
